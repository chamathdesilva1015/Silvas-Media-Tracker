name: Weekly Database Backup

on:
  schedule:
    - cron: '0 3 * * 0' # Run every Sunday at 03:00 UTC
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions UI

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Encrypted Database Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY || secrets.ADMIN_PASSWORD }}
        run: |
          python backup_database.py --encrypt

      - name: Upload Backup to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backups/*
          retention-days: 90
          if-no-files-found: error
